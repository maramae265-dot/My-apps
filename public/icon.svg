<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#cyber)" stroke-width="8" opacity="0.8"/>

  <!-- Outer Crosshair Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.4" stroke-dasharray="24 12"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#22d3ee" stroke-width="8" opacity="0.8"/>

  <!-- Crosshair Ticks -->
  <line x1="256" y1="56" x2="256" y2="116" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="396" x2="256" y2="456" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="116" y2="256" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  <line x1="396" y1="256" x2="456" y2="256" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>

  <!-- Apex Cyber Crown / Triangle Logo -->
  <path d="M 256 150 L 330 310 L 256 280 L 182 310 Z" fill="url(#cyber)" filter="url(#glow)"/>

  <!-- Center Energy Core -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="#facc15"/>
</svg>
